<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flash Game Player</title>
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #000;
    }
    #game {
      width: 800px;  /* adjust for your game */
      height: 600px;
    }
  </style>
</head>
<body>
  <!-- The SWF game will load here -->
  <div id="game"></div>

  <script>
    // Create a Ruffle instance
    const ruffle = window.RufflePlayer.newest();
    const player = ruffle.createPlayer();
    document.getElementById("game").appendChild(player);

    // Load the SWF from the repo (must be in the same folder as this HTML file)
    player.load("SSF2Beta_v1.3.1.2.swf"); 
  </script>
</body>
</html>
