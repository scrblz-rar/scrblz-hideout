<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Super Smash Flash 2</title>
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
  <style>
    body {
      margin: 0;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    #game {
      width: 100%;
      height: 100%;
      max-width: 960px; /* Change to your SWF size */
      max-height: 720px;
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <script>
    window.addEventListener("load", () => {
      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();
      document.getElementById("game").appendChild(player);
      player.load("SSF2.swf"); // your SWF file in the repo
    });
  </script>
</body>
</html>
