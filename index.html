<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scrblz Hideout</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Consolas", monospace;
      background: repeating-conic-gradient(#ccc 0% 25%, transparent 0% 50%) 
                  50% / 40px 40px; /* checkerboard pattern */
    }

    .container {
      display: flex;
      align-items: center;
      gap: 40px;
    }

    .character img {
      max-height: 500px;
      width: auto;
      filter: drop-shadow(0 0 10px rgba(0,0,0,0.4));
    }

    .window {
      background: rgba(255, 255, 255, 0.8); /* semi transparent white window */
      border: 2px solid #333;
      border-radius: 10px;
      padding: 300px 100px;
      text-align: left;
      box-shadow: 0 0 15px rgba(0,0,0,0.25);
      max-width: 1000px;
      width: 90%;
    }

    h2 {
      margin: 0 0 20px 0;
      font-size: 1.5rem;
      text-align: center;
      color: #111;
    }

    .path {
      color: #444;
      font-weight: bold;
      margin: 15px 0 5px;
    }

    ul {
      list-style-type: none;
      padding: 0;
      margin: 0;
    }

    a {
      color: #0066cc;
      text-decoration: none;
      font-weight: 600;
    }

    a:hover {
      text-decoration: underline;
    }

    .folder::before {
      content: "📁 ";
    }

    .file::before {
      content: "📄 ";
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Left side character -->
    <div class="character">
      <img src="© (2).png" alt="Scrblz Character">
    </div>

    <!-- Right side window -->
    <div class="window">
      <h2>Scrblz Hideout</h2>
      <p class="path">C:\SCRBLZ_HIDEOUT\></p>
      
      <ul>
        <li class="folder"><a href="#">Games</a></li>
        <li class="folder"><a href="#">Tools</a></li>
        <li class="file"><a href="https://drive.google.com/your-share-link" target="_blank">Unblocked Game Drive</a></li>
        <li class="file"><a href="about.html">About.txt</a></li>
      </ul>

      <p class="path">C:\></p>
    </div>
  </div>
</body>
</html>
