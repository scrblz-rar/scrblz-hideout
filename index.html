<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>scrblz hideout</title>
  <style>
    /* ====== Base / Background ====== */
    :root{
      --ink:#111; --muted:#3a3a3a; --accent:#0ea5e9; --glass:#ffffffcc; --border:#222;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; font-family:Consolas, monaco, monospace; color:var(--ink);
      display:flex; align-items:center; justify-content:center; min-height:100vh; overflow:hidden;
      /* Fake transparency: checkerboard + animated gradient overlay */
      background:
        repeating-conic-gradient(#d0d0d0 0% 25%, transparent 0% 50%) 50%/40px 40px;
      position:relative;
    }
    /* animated gradient layer */
    body::before{
      content:""; position:fixed; inset:0; pointer-events:none;
      background: linear-gradient(120deg, rgba(14,165,233,0.25), rgba(99,102,241,0.25), rgba(16,185,129,0.25));
      mix-blend-mode: multiply; filter: saturate(1.2);
      animation: shift 12s ease-in-out infinite alternate;
    }
    @keyframes shift{
      0%{ backdrop-filter: blur(0px); background-position: 0% 50%; }
      50%{ backdrop-filter: blur(1px); background-position: 50% 50%; }
      100%{ backdrop-filter: blur(2px); background-position: 100% 50%; }
    }

    /* ====== Layout ====== */
    .stage{ display:flex; align-items:center; gap:42px; flex-wrap:wrap; padding:24px; }
    .character img{ max-height:480px; width:auto; filter: drop-shadow(0 0 12px rgba(0,0,0,.45)); animation: float 4.5s ease-in-out infinite; }
    @keyframes float{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-6px) }}

    /* Decorative elements OUTSIDE the window */
    .badges{ position:fixed; top:18px; left:18px; display:flex; gap:10px; flex-wrap:wrap; }
    .badge{ border:1px dashed #3b3b3b; padding:6px 10px; border-radius:999px; background:#ffffffaa; backdrop-filter: blur(3px); font-size:12px }
    .corner{ position:fixed; width:22px; height:22px; border:2px solid #000; opacity:.18 }
    .corner.tl{ top:10px; left:10px; border-right:none; border-bottom:none }
    .corner.tr{ top:10px; right:10px; border-left:none; border-bottom:none }
    .corner.bl{ bottom:10px; left:10px; border-right:none; border-top:none }
    .corner.br{ bottom:10px; right:10px; border-left:none; border-top:none }

    /* ====== App Window ====== */
    .window{
      position:relative; max-width:820px; width:min(92vw, 820px);
      background: var(--glass); border:2px solid var(--border); border-radius:12px;
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
      overflow:hidden;
    }
    .titlebar{ display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:2px solid var(--border); background:linear-gradient(#f6f6f6cc,#eaeaeacc); }
    .dot{ width:12px; height:12px; border-radius:50%; border:1px solid #0003 }
    .dot.red{ background:#ef4444 }
    .dot.yellow{ background:#f59e0b }
    .dot.green{ background:#22c55e }
    .title{ font-weight:700; letter-spacing:.5px; margin-left:4px }

    .chrome{ display:flex; align-items:center; gap:8px; margin-left:auto; opacity:.8 }
    .chrome button{ font-family:inherit; font-size:12px; border:1px solid #2a2a2a; padding:4px 8px; border-radius:6px; background:#fff; cursor:pointer }
    .chrome button:hover{ box-shadow:0 0 0 2px rgba(14,165,233,.2) inset }

    .wrap{ padding:16px 18px 20px }

    /* ====== Source Path (auto-typing at top) ====== */
    .pathbar{ position:relative; display:flex; align-items:center; gap:10px; background:#ffffffe6; border:1px solid #2a2a2a; border-radius:10px; padding:10px 12px; box-shadow: inset 0 2px 6px #00000010; }
    .prompt{ color:#333; font-weight:700 }
    .path{
      flex:1; min-width:0; display:inline-block; white-space:nowrap; overflow:hidden; border-right:2px solid #333;
      /* typing and caret */
      animation: typing 2.2s steps(28, end) forwards, blink .75s step-end infinite alternate 2.2s; /* caret blinks after typing */
    }
    @keyframes typing{ from{ width:0 } to{ width:100% } }
    @keyframes blink{ 50%{ border-color:transparent } }

    /* ====== Content list ====== */
    h2{ margin:12px 0 4px; text-align:center }
    .pathlabel{ color:#333; font-weight:700; margin:14px 0 8px }
    ul{ list-style:none; padding:0; margin:0 }
    li{ margin:10px 0 }
    a{ color:#0b5ec9; font-weight:700; text-decoration:none }
    a:hover{ text-decoration:underline; text-shadow:0 0 6px rgba(11,94,201,.35) }
    .folder::before{ content:"\1F4C1  " }
    .file::before{ content:"\1F4C4  " }

    /* Subtle status bar outside content */
    .status{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:8px 14px; border-top:2px solid var(--border); background:#f5f5f5c7; font-size:12px }
    .meter{ height:8px; width:160px; background:#e5e7eb; border:1px solid #2a2a2a; border-radius:999px; overflow:hidden }
    .meter > i{ display:block; height:100%; width:40%; background:linear-gradient(90deg,#22c55e,#0ea5e9) }

    /* ====== Responsive ====== */
    @media (max-width:860px){
      .character img{ max-height:320px }
      .stage{ gap:20px }
    }
  </style>
</head>
<body>
  <!-- Decorative UI outside the window -->
  <div class="badges">
    <div class="badge">SCRBLZ SYSTEM v0.3</div>
    <div class="badge">ACCESS: REQUEST-ONLY</div>
    <div class="badge">STYLE: FILE-EXPLORER / GLASS</div>
  </div>
  <span class="corner tl"></span>
  <span class="corner tr"></span>
  <span class="corner bl"></span>
  <span class="corner br"></span>

  <div class="stage">
    <!-- Character art -->
    <div class="character">
      <img src="© (2).png" alt="Scrblz Character" />
    </div>

    <!-- Main window -->
    <div class="window">
      <div class="titlebar">
        <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
        <span class="title">Game Loader</span>
        <div class="chrome">
          <button type="button" id="btnReload" title="Reload">↻</button>
          <button type="button" id="btnOpen" title="Open in new tab">⧉</button>
        </div>
      </div>

      <div class="wrap">
        <!-- Source path with auto-typing caret animation -->
        <div class="pathbar" aria-label="source path">
          <span class="prompt">C:\\</span>
          <span id="typedPath" class="path" aria-live="polite"></span>
        </div>

        <h2>Scrblz Hideout</h2>
        <p class="pathlabel">C:\\SCRBLZ_HIDEOUT\></p>
        <ul>
          <li class="folder"><a href="https://docs.google.com/forms/d/e/1FAIpQLSdvSd8Vza3DI1ZTvzSMg0VhdUPsQ7HaYOEZahIaO7vDuHajww/viewform?usp=sharing" target="_blank" rel="noopener">drive access</a></li>
          <li class="file"><a href="https://drive.google.com/your-share-link" target="_blank" rel="noopener">drive list</a></li>
          <li class="file"><a href="about.html">about.txt</a></li>
        </ul>
      </div>

      <div class="status">
        <span>STATUS: idle</span>
        <div class="meter" title="disk usage">
          <i></i>
        </div>
        <span>SCRBLZ:\\\\\\</span>
      </div>
    </div>
  </div>

  <script>
    // Auto-type the path text at the top with a caret animation
    const TARGET = "SCRBLZ_HIDEOUT\\src\\games\\repo>"; // customize the path text here
    const el = document.getElementById('typedPath');

    let i = 0;
    function typeNext(){
      if(i <= TARGET.length){
        el.textContent = TARGET.slice(0, i);
        i++;
        // Vary typing speed slightly for a more natural feel
        const jitter = 15 + Math.random()*40;
        setTimeout(typeNext, jitter);
      }
    }
    // Start typing after a short delay so the window paints first
    setTimeout(typeNext, 350);

    // Chrome buttons (simple helpers)
    document.getElementById('btnReload').addEventListener('click', ()=> location.reload());
    document.getElementById('btnOpen').addEventListener('click', ()=> window.open('https://drive.google.com/your-share-link','_blank','noopener'));
  </script>
</body>
</html>
