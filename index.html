<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scrblz Hideout – Access Page</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(270deg, #0f0f0f, #1a1a2e, #222, #1a1a2e);
      background-size: 600% 600%;
      animation: gradientShift 15s ease infinite;
      font-family: monospace;
      color: #eee;
    }

    @keyframes gradientShift {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }

    .window {
      background: rgba(20,20,20,0.9);
      border: 2px solid #555;
      border-radius: 10px;
      box-shadow: 0 0 25px rgba(0,0,0,0.7);
      width: 600px;
      max-width: 95%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .title-bar {
      background: #111;
      padding: 6px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
      font-size: 14px;
    }

    .window-controls {
      display: flex;
      gap: 6px;
    }

    .ctrl-btn {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .close {background: #e33;}
    .min {background: #ee0;}
    .max {background: #3d3;}

    .source-path {
      padding: 10px;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      border-bottom: 1px solid #333;
    }

    .caret {
      display: inline-block;
      width: 8px;
      background: #eee;
      margin-left: 2px;
      animation: blink 1s steps(1) infinite;
    }

    @keyframes blink {
      50% {background: transparent;}
    }

    .content {
      flex-grow: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    iframe {
      border: none;
      width: 100%;
      height: 400px;
      border-radius: 8px;
      background: repeating-conic-gradient(#222 0% 25%, #333 0% 50%) 50% / 20px 20px;
      animation: glow 4s ease-in-out infinite;
    }

    @keyframes glow {
      0%, 100% {box-shadow: 0 0 10px #0ff;}
      50% {box-shadow: 0 0 25px #0ff;}
    }

    .status-bar {
      font-size: 12px;
      padding: 5px 10px;
      border-top: 1px solid #333;
      background: #111;
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="window">
    <div class="title-bar">
      <span>Scrblz Hideout – Access</span>
      <div class="window-controls">
        <div class="ctrl-btn close"></div>
        <div class="ctrl-btn min"></div>
        <div class="ctrl-btn max"></div>
      </div>
    </div>

    <div class="source-path" id="sourcePath"></div>

    <div class="content">
      <iframe src="https://js13kgames.com/games/spacecraft/index.html"></iframe>
    </div>

    <div class="status-bar">[ ACCESS: ONLINE ]</div>
  </div>

  <script>
    const path = "/drive/ScrblzHideout/Access/index.html";
    const el = document.getElementById("sourcePath");
    let i = 0;

    function typePath(){
      if (i < path.length){
        el.innerHTML = path.substring(0, i+1) + '<span class="caret"></span>';
        i++;
        setTimeout(typePath, 80);
      } else {
        el.innerHTML = path + '<span class="caret"></span>';
      }
    }

    typePath();
  </script>
</body>
</html>
